<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>U.S. Citizenship Test — Study App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── ONBOARDING OVERLAY ── -->
<div id="onboarding" class="onboarding-overlay">
  <div class="onboarding-card">
    <div class="onboarding-flag">🇺🇸</div>
    <h2>Welcome</h2>
    <p>Some questions have answers that depend on where you live. Tell us your state so we can show you the right answers.</p>
    <label for="state-select">Your state</label>
    <select id="state-select">
      <option value="">— Choose a state —</option>
      <option>Alabama</option><option>Alaska</option><option>Arizona</option>
      <option>Arkansas</option><option>California</option><option>Colorado</option>
      <option>Connecticut</option><option>Delaware</option><option>Florida</option>
      <option>Georgia</option><option>Hawaii</option><option>Idaho</option>
      <option>Illinois</option><option>Indiana</option><option>Iowa</option>
      <option>Kansas</option><option>Kentucky</option><option>Louisiana</option>
      <option>Maine</option><option>Maryland</option><option>Massachusetts</option>
      <option>Michigan</option><option>Minnesota</option><option>Mississippi</option>
      <option>Missouri</option><option>Montana</option><option>Nebraska</option>
      <option>Nevada</option><option>New Hampshire</option><option>New Jersey</option>
      <option>New Mexico</option><option>New York</option><option>North Carolina</option>
      <option>North Dakota</option><option>Ohio</option><option>Oklahoma</option>
      <option>Oregon</option><option>Pennsylvania</option><option>Rhode Island</option>
      <option>South Carolina</option><option>South Dakota</option><option>Tennessee</option>
      <option>Texas</option><option>Utah</option><option>Vermont</option>
      <option>Virginia</option><option>Washington</option><option>West Virginia</option>
      <option>Wisconsin</option><option>Wyoming</option>
      <option>District of Columbia</option>
    </select>
    <button class="onboarding-btn" id="onboarding-btn" onclick="saveState()" disabled>Continue →</button>
  </div>
</div>

<header>
  <h1>U.S. Citizenship Test</h1>
  <p class="subtitle">2025 Civics Test &middot; 128 Official Questions</p>
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-flashcard" onclick="setMode('flashcard')">Flashcards</button>
    <button class="mode-tab" id="tab-browse" onclick="setMode('browse')">Browse All</button>
  </div>
  <div class="header-meta">
    <label class="meta-chip" for="lang-select">&#127758;
    <select id="lang-select" onchange="setLanguage(this.value)">
      <option value="en">English</option>
      <option value="hi">&#2361;&#2367;&#2344;&#2381;&#2342;&#2368; (Hindi)</option>
      <option value="es">Espa&#241;ol (Spanish)</option>
      <option value="zh">&#20013;&#25991; (Chinese)</option>
      <option value="vi">Ti&#7871;ng Vi&#7879;t (Vietnamese)</option>
      <option value="ko">&#54620;&#44397;&#50612; (Korean)</option>
      <option value="tl">Tagalog</option>
      <option value="pt">Portugu&#234;s (Portuguese)</option>
      <option value="ar">&#1575;&#1604;&#1593;&#1585;&#1576;&#1610;&#1577; (Arabic)</option>
      <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
      <option value="gu">ગુજરાતી (Gujarati)</option>
      <option value="ur">اردو (Urdu)</option>
      <option value="bn">বাংলা (Bengali)</option>
      <option value="fr">Français (French)</option>
      <option value="ta">தமிழ் (Tamil)</option>
      <option value="fa">فارسی (Persian)</option>
      <option value="ru">Русский (Russian)</option>
      <option value="ht">Kreyòl Ayisyen (Haitian Creole)</option>
    </select>
    </label>
    <span class="meta-chip">&#128205; <span id="header-state">—</span>
      <button class="change-state-btn" onclick="showOnboarding()">Change</button>
    </span>
  </div>
</header>

<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('all', event)">All 128</button>
  <button class="filter-btn senior-btn" onclick="setFilter('senior', event)">&#9733; Senior 20</button>
  <button class="filter-btn starred-filter-btn" onclick="setFilter('starred', event)">&#9873; Flagged</button>
</div>

<main>
  <!-- ── FLASHCARD MODE ── -->
  <div id="view-flashcard">
    <div class="progress-row">
      <span class="progress-label" id="progress-label">1 / 128</span>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-actions">
        <button class="icon-btn" title="Shuffle" onclick="shuffleDeck()">&#8635;</button>
        <button class="icon-btn" title="Reset order" onclick="resetDeck()">&#8634;</button>
      </span>
    </div>

    <div class="translate-status" id="translate-status" style="display:none">Translating&#8230;</div>

    <div class="flashcard-wrap" onclick="flipCard()">
      <div class="flashcard" id="flashcard">
        <!-- FRONT -->
        <div class="card-face card-front">
          <button class="card-flag-btn" id="star-btn" title="Flag for review"
                  onclick="event.stopPropagation(); toggleStar()"><span id="star-icon">&#9872;</span></button>
          <div id="card-senior-badge"></div>
          <div class="card-number" id="card-number">#1</div>
          <p class="card-question" id="card-question">Loading&#8230;</p>
          <p class="card-question-secondary" id="card-question-en" style="display:none"></p>
          <p class="card-hint" id="card-hint">Tap card to see the answer</p>
          <div class="audio-row">
            <button class="audio-btn" id="btn-read-q" onclick="event.stopPropagation(); speakQuestion()">&#128266; Read Question</button>
            <button class="stop-btn" title="Stop reading" onclick="event.stopPropagation(); stopSpeech()">&#9632;</button>
          </div>
        </div>
        <!-- BACK -->
        <div class="card-face card-back">
          <div class="card-tag" id="card-back-tag">Acceptable Answers</div>
          <div class="card-number" id="card-number-back">#1</div>
          <ul class="card-answers" id="card-answers"></ul>
          <ul class="card-answers card-answers-en" id="card-answers-en" style="display:none"></ul>
          <div class="audio-row">
            <button class="audio-btn audio-btn-back" id="btn-read-a" onclick="event.stopPropagation(); speakAnswer()">&#128266; Read Answer</button>
            <button class="stop-btn stop-btn-back" title="Stop reading" onclick="event.stopPropagation(); stopSpeech()">&#9632;</button>
          </div>
        </div>
      </div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="btn-prev" onclick="prevCard()">&#8592; Prev</button>
      <span class="nav-counter" id="nav-counter">1 / 128</span>
      <button class="nav-btn primary" id="btn-next" onclick="nextCard()">Next &#8594;</button>
    </div>

    <div class="auto-read-row">
      <label class="auto-read-label">
        <input type="checkbox" id="auto-read" />
        <span class="switch"></span>
        Auto-read questions
      </label>
    </div>
  </div>

  <!-- ── BROWSE MODE ── -->
  <div id="view-browse" style="display:none">
    <div class="browse-list" id="browse-list"></div>
  </div>
</main>

<script src="questions.js"></script>
<script>
  // ── Live government data ───────────────────────────────────────────────────
  // gov_data.json is produced daily by scraper/scrape.py (GitHub Actions),
  // scraping senate.gov, house.gov, whitehouse.gov, supremecourt.gov, usa.gov.
  // No official's name is hardcoded in the app — questions marked `dynamic`
  // in questions.js are filled in from this data at run time.
  const GOV_DATA_URLS = [
    'https://raw.githubusercontent.com/anika-kum/CitizenshipTest/main/gov_data.json',
    'gov_data.json' // same-origin copy when served locally / by the app bundle host
  ];
  let govData = null;

  // State capitals are fixed facts (like the question text itself) — they are
  // state-dependent but never change, so they don't go through the scraper.
  const STATE_CAPITALS = {
    'Alabama': 'Montgomery', 'Alaska': 'Juneau', 'Arizona': 'Phoenix',
    'Arkansas': 'Little Rock', 'California': 'Sacramento', 'Colorado': 'Denver',
    'Connecticut': 'Hartford', 'Delaware': 'Dover', 'Florida': 'Tallahassee',
    'Georgia': 'Atlanta', 'Hawaii': 'Honolulu', 'Idaho': 'Boise',
    'Illinois': 'Springfield', 'Indiana': 'Indianapolis', 'Iowa': 'Des Moines',
    'Kansas': 'Topeka', 'Kentucky': 'Frankfort', 'Louisiana': 'Baton Rouge',
    'Maine': 'Augusta', 'Maryland': 'Annapolis', 'Massachusetts': 'Boston',
    'Michigan': 'Lansing', 'Minnesota': 'St. Paul', 'Mississippi': 'Jackson',
    'Missouri': 'Jefferson City', 'Montana': 'Helena', 'Nebraska': 'Lincoln',
    'Nevada': 'Carson City', 'New Hampshire': 'Concord', 'New Jersey': 'Trenton',
    'New Mexico': 'Santa Fe', 'New York': 'Albany', 'North Carolina': 'Raleigh',
    'North Dakota': 'Bismarck', 'Ohio': 'Columbus', 'Oklahoma': 'Oklahoma City',
    'Oregon': 'Salem', 'Pennsylvania': 'Harrisburg', 'Rhode Island': 'Providence',
    'South Carolina': 'Columbia', 'South Dakota': 'Pierre', 'Tennessee': 'Nashville',
    'Texas': 'Austin', 'Utah': 'Salt Lake City', 'Vermont': 'Montpelier',
    'Virginia': 'Richmond', 'Washington': 'Olympia', 'West Virginia': 'Charleston',
    'Wisconsin': 'Madison', 'Wyoming': 'Cheyenne'
  };

  // English templates for dynamic-answer sentences. Translation packs carry
  // the same keys in their _ui section; {name} is substituted at render time.
  const MSG = {
    offline: 'Live data unavailable — please connect to the internet and reopen the app',
    repsNote: 'Your answer depends on your congressional district — find yours at house.gov:',
    dcNoSenators: 'D.C. has no U.S. senators.',
    dcNoGovernor: 'D.C. does not have a governor.',
    dcMayor: 'The mayor of D.C. is {name}.',
    dcCapital: 'D.C. is not a state and does not have a capital. (D.C. itself is the capital of the United States.)'
  };

  // Dynamic answers are stored as metadata ({key} = translatable template,
  // {name} = proper noun, never translated) and rendered to strings in
  // whichever language is active. ui = pack._ui, or null for English.
  function renderAnswerMeta(meta, ui) {
    return meta.map(m => {
      const tmpl = m.key ? ((ui && ui[m.key]) || MSG[m.key]) : '{name}';
      return tmpl.replace('{name}', m.name || '');
    });
  }

  // Q62 (state capital) is filled from the fixed map — no network involved,
  // so it runs synchronously at startup, before the .gov data fetch resolves.
  function applyStateCapital() {
    const state = localStorage.getItem('uscis-state');
    const q = QUESTIONS.find(q => q.dynamic === 'capital');
    if (!q || !state) return;
    q.tMeta = state === 'District of Columbia'
      ? [{ key: 'dcCapital' }]
      : [{ name: STATE_CAPITALS[state] }];
    q.answers = renderAnswerMeta(q.tMeta, null);
  }

  async function loadGovData() {
    for (const url of GOV_DATA_URLS) {
      try {
        const res = await fetch(url, { cache: 'no-cache' });
        if (!res.ok) continue;
        govData = await res.json();
        break;
      } catch { /* try next source */ }
    }
    applyGovData();
  }

  function applyGovData() {
    // Onboarding guarantees a state is chosen before any card is visible;
    // if it is somehow missing, the onboarding overlay is covering the screen.
    const state = localStorage.getItem('uscis-state');
    const offline = [{ key: 'offline' }];

    applyStateCapital(); // capital needs no network — fixed in-app map

    QUESTIONS.forEach(q => {
      if (!q.dynamic || q.dynamic === 'capital') return;

      if (!govData) { q.tMeta = offline; }
      else switch (q.dynamic) {
        case 'president':     q.tMeta = [{ name: govData.president }]; break;
        case 'vicePresident': q.tMeta = [{ name: govData.vicePresident }]; break;
        case 'speaker':       q.tMeta = [{ name: govData.speaker }]; break;
        case 'chiefJustice':  q.tMeta = [{ name: govData.chiefJustice }]; break;
        case 'senators':
          if (!state) break;
          // D.C. residents answer that D.C. has no U.S. senators
          q.tMeta = govData.senators[state]
            ? govData.senators[state].map(n => ({ name: n }))
            : (state === 'District of Columbia' ? [{ key: 'dcNoSenators' }] : offline);
          break;
        case 'governors':
          if (!state) break;
          // D.C. residents answer that D.C. does not have a governor
          q.tMeta = state === 'District of Columbia'
            ? [{ key: 'dcNoGovernor' }].concat(
                govData.governors[state] ? [{ key: 'dcMayor', name: govData.governors[state] }] : [])
            : (govData.governors[state] ? [{ name: govData.governors[state] }] : offline);
          break;
        case 'representatives': {
          if (!state) break;
          const reps = govData.representatives[state];
          q.tMeta = !reps ? offline
            : reps.length === 1 ? [{ name: reps[0].name }]
            : [{ key: 'repsNote' }].concat(
                reps.map(r => ({ name: r.name + ' (' + r.district + ' district)' })));
          break;
        }
      }
      if (q.tMeta) q.answers = renderAnswerMeta(q.tMeta, null);
    });

    // Refresh whatever is on screen
    if (mode === 'flashcard') {
      renderCard();
      translateCurrentCard(translateVersion);
    } else {
      renderBrowse();
    }
  }

  // ── Onboarding ─────────────────────────────────────────────────────────────
  const stateSelectEl = document.getElementById('state-select');
  stateSelectEl.addEventListener('change', () => {
    document.getElementById('onboarding-btn').disabled = !stateSelectEl.value;
  });

  function saveState() {
    const s = stateSelectEl.value;
    if (!s) return;
    localStorage.setItem('uscis-state', s);
    document.getElementById('header-state').textContent = s;
    document.getElementById('onboarding').classList.add('hidden');
    applyGovData(); // state-specific answers (senators, governor, rep) change with the state
  }

  function showOnboarding() {
    const saved = localStorage.getItem('uscis-state') || '';
    stateSelectEl.value = saved;
    document.getElementById('onboarding-btn').disabled = !saved;
    document.getElementById('onboarding').classList.remove('hidden');
  }

  // On load: skip onboarding if state already saved
  (function initState() {
    const saved = localStorage.getItem('uscis-state');
    if (saved) {
      document.getElementById('header-state').textContent = saved;
      document.getElementById('onboarding').classList.add('hidden');
    }
  })();

  // ── Native speech bridge (iOS app) ──────────────────────────────────────────
  // Inside the iOS app, speech is handled natively by AVSpeechSynthesizer
  // (reliable voices, plays even with the mute switch on). In a regular
  // browser this is undefined and we fall back to the Web Speech API.
  const NATIVE_SPEECH = (window.webkit && window.webkit.messageHandlers &&
                         window.webkit.messageHandlers.speech) || null;

  // ── iOS Audio Unlock (Web Speech fallback only) ─────────────────────────────
  // iOS 18 and below require the audio system to be activated by a real user
  // touch before speechSynthesis.speak() will do anything. A silent empty
  // utterance on the first tap unlocks it for the rest of the session.
  if (!NATIVE_SPEECH && 'speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    document.addEventListener('touchstart', function unlock() {
      const u = new SpeechSynthesisUtterance('');
      u.volume = 0;
      window.speechSynthesis.speak(u);
      window.speechSynthesis.cancel();
      document.removeEventListener('touchstart', unlock);
    }, { once: true, passive: true });
  }

  // ── Languages ──────────────────────────────────────────────────────────────
  const LANGUAGES = {
    en: { name: 'English',             tts: 'en-US' },
    hi: { name: 'Hindi',               tts: 'hi-IN' },
    es: { name: 'Spanish',             tts: 'es-ES' },
    zh: { name: 'Chinese (Simplified)',tts: 'zh-CN' },
    vi: { name: 'Vietnamese',          tts: 'vi-VN' },
    ko: { name: 'Korean',              tts: 'ko-KR' },
    tl: { name: 'Tagalog',             tts: 'fil-PH' },
    pt: { name: 'Portuguese',          tts: 'pt-BR' },
    ar: { name: 'Arabic',              tts: 'ar-SA', rtl: true },
    pa: { name: 'Punjabi',             tts: 'pa-IN' },
    gu: { name: 'Gujarati',            tts: 'gu-IN' },
    ur: { name: 'Urdu',                tts: 'ur-PK', rtl: true },
    bn: { name: 'Bengali',             tts: 'bn-IN' },
    fr: { name: 'French',              tts: 'fr-FR' },
    ta: { name: 'Tamil',               tts: 'ta-IN' },
    fa: { name: 'Persian (Farsi)',     tts: 'fa-IR', rtl: true },
    ru: { name: 'Russian',             tts: 'ru-RU' },
    ht: { name: 'Haitian Creole',      tts: 'ht-HT' },
  };

  let currentLang = 'en';
  let translateVersion = 0; // prevents stale async pack loads from overwriting newer cards

  // ── Translation packs ────────────────────────────────────────────────────
  // All translations are generated and reviewed ahead of time and shipped as
  // static files (translations/<lang>.js) — no translation API is called at
  // runtime, so there is no rate cap and translation works offline.
  // Each file calls registerTranslations(lang, pack) when it loads.
  // pack format: { "_ui": {...}, "<questionId>": { q: "...", a: [...]|null } }
  // a: null marks dynamic questions — officials' names are never translated.
  const TRANSLATION_PACKS = {}; // lang → pack object (or null if load failed)
  const _packWaiters = {};

  function registerTranslations(lang, pack) {
    TRANSLATION_PACKS[lang] = pack;
    (_packWaiters[lang] || []).forEach(cb => cb(pack));
    delete _packWaiters[lang];
  }

  function loadPack(lang, cb) {
    if (TRANSLATION_PACKS[lang] !== undefined) { cb(TRANSLATION_PACKS[lang]); return; }
    const alreadyLoading = !!_packWaiters[lang];
    (_packWaiters[lang] = _packWaiters[lang] || []).push(cb);
    if (alreadyLoading) return;
    const s = document.createElement('script');
    s.src = 'translations/' + lang + '.js';
    s.onerror = () => registerTranslations(lang, null); // fall back to English
    document.head.appendChild(s);
  }

  function setLanguage(lang) {
    currentLang = lang;
    if (lang !== 'en') loadPack(lang, () => {}); // start loading immediately
    if (mode === 'flashcard') {
      renderCard();       // resets to English immediately
      translateCurrentCard(translateVersion);
    }
  }

  // ── Starred (persisted to localStorage) ───────────────────────────────────
  let starred = loadStarred();

  function loadStarred() {
    try {
      const s = localStorage.getItem('uscis-starred');
      return s ? new Set(JSON.parse(s)) : new Set();
    } catch { return new Set(); }
  }

  function saveStarred() {
    localStorage.setItem('uscis-starred', JSON.stringify([...starred]));
  }

  function toggleStar() {
    if (!deck[cardIndex]) return;
    const id = deck[cardIndex].id;
    const wasStarred = starred.has(id);
    if (wasStarred) starred.delete(id); else starred.add(id);
    saveStarred();
    updateStarBtn();
    // If we're currently viewing the starred filter and just removed this card, rebuild deck
    if (filter === 'starred' && wasStarred) {
      deck = QUESTIONS.filter(q => starred.has(q.id));
      cardIndex = Math.min(cardIndex, Math.max(0, deck.length - 1));
      renderCard();
      translateCurrentCard(translateVersion);
    }
  }

  function updateStarBtn() {
    if (!deck[cardIndex]) return;
    const isStarred = starred.has(deck[cardIndex].id);
    const btn = document.getElementById('star-btn');
    const icon = document.getElementById('star-icon');
    if (!btn || !icon) return;
    icon.textContent = isStarred ? '⚑' : '⚐';
    btn.classList.toggle('starred', isStarred);
    btn.title = isStarred ? 'Flagged — tap to remove' : 'Flag for review';
  }

  // ── State ──────────────────────────────────────────────────────────────────
  let mode = 'flashcard';
  let filter = 'all';
  let deck = [];
  let cardIndex = 0;
  let flipped = false;

  // ── Speech ─────────────────────────────────────────────────────────────────
  let _iosSpeechTimer = null;

  function speak(text, lang) {
    const code = LANGUAGES[lang || currentLang]?.tts || 'en-US';

    if (NATIVE_SPEECH) {
      NATIVE_SPEECH.postMessage({ action: 'speak', text: text, lang: code });
      return;
    }

    // iOS fix 1: only cancel if already speaking — calling cancel() then speak()
    // immediately causes iOS to silently drop the request
    if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();

    clearInterval(_iosSpeechTimer);

    const u = new SpeechSynthesisUtterance(text);
    u.lang = code;
    u.rate = 0.85;

    // iOS fix 2: iOS pauses speech synthesis after ~15 seconds and never resumes.
    // Nudging pause/resume every 10s keeps it alive for long answers.
    _iosSpeechTimer = setInterval(() => {
      if (!window.speechSynthesis.speaking) {
        clearInterval(_iosSpeechTimer);
      } else {
        window.speechSynthesis.pause();
        window.speechSynthesis.resume();
      }
    }, 10000);

    u.onend = u.onerror = () => clearInterval(_iosSpeechTimer);
    window.speechSynthesis.speak(u);
  }

  function speakQuestion() {
    const el = document.getElementById('card-question');
    if (el && el.textContent) speak(el.textContent);
  }

  function speakAnswer() {
    const ul = document.getElementById('card-answers');
    if (!ul) return;
    const text = Array.from(ul.querySelectorAll('li')).map(li => li.textContent).join('. ');
    speak(text);
  }

  function stopSpeech() {
    if (NATIVE_SPEECH) {
      NATIVE_SPEECH.postMessage({ action: 'stop' });
      return;
    }
    clearInterval(_iosSpeechTimer);
    window.speechSynthesis.cancel();
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  applyStateCapital(); // synchronous — capital is correct on the very first render
  applyFilter('all');
  loadGovData();

  // ── Filter ─────────────────────────────────────────────────────────────────
  function setFilter(f, e) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (e && e.currentTarget) e.currentTarget.classList.add('active');
    applyFilter(f);
  }

  function applyFilter(f) {
    if (f === 'all')           deck = [...QUESTIONS];
    else if (f === 'senior')   deck = QUESTIONS.filter(q => q.senior);
    else if (f === 'starred')  deck = QUESTIONS.filter(q => starred.has(q.id));
    else                       deck = QUESTIONS.filter(q => q.category === f);
    cardIndex = 0;
    flipped = false;
    if (mode === 'flashcard') {
      renderCard();
      translateCurrentCard(translateVersion);
    } else {
      renderBrowse();
    }
  }

  // ── Mode ───────────────────────────────────────────────────────────────────
  function setMode(m) {
    mode = m;
    document.getElementById('view-flashcard').style.display = m === 'flashcard' ? '' : 'none';
    document.getElementById('view-browse').style.display     = m === 'browse'    ? '' : 'none';
    document.getElementById('tab-flashcard').classList.toggle('active', m === 'flashcard');
    document.getElementById('tab-browse').classList.toggle('active', m === 'browse');
    if (m === 'browse') renderBrowse();
    else { flipped = false; renderCard(); translateCurrentCard(translateVersion); }
  }

  // ── Flashcard (sync — English only) ────────────────────────────────────────
  function renderCard() {
    stopSpeech();
    translateVersion++; // invalidate any in-flight translation for the previous card

    const qEl       = document.getElementById('card-question');
    const qEnEl     = document.getElementById('card-question-en');
    const answersEl = document.getElementById('card-answers');
    const answersEnEl = document.getElementById('card-answers-en');

    if (deck.length === 0) {
      qEl.textContent = 'No questions match this filter.';
      qEnEl.style.display = 'none';
      answersEl.innerHTML = '';
      answersEnEl.style.display = 'none';
      document.getElementById('card-number').textContent = '';
      document.getElementById('card-number-back').textContent = '';
      document.getElementById('card-senior-badge').innerHTML = '';
      document.getElementById('nav-counter').textContent = '0 / 0';
      document.getElementById('progress-label').textContent = '0 / 0';
      document.getElementById('progress-fill').style.width = '0%';
      document.getElementById('btn-prev').disabled = true;
      document.getElementById('btn-next').disabled = true;
      return;
    }

    const q = deck[cardIndex];
    const total = deck.length;

    // Un-flip
    document.getElementById('flashcard').classList.remove('flipped');
    flipped = false;

    // Reset to English (UI chrome included — translation pass re-labels below)
    document.getElementById('btn-read-q').textContent = '🔊 Read Question';
    document.getElementById('btn-read-a').textContent = '🔊 Read Answer';
    document.getElementById('card-hint').textContent = 'Tap card to see the answer';
    document.getElementById('card-number').textContent = '#' + q.id;
    document.getElementById('card-number-back').textContent = '#' + q.id;
    document.getElementById('card-senior-badge').innerHTML =
      q.senior ? '<span class="senior-badge">★ Senior Question</span>' : '';
    qEl.textContent = q.question;
    qEl.dir = 'ltr';
    qEnEl.style.display = 'none';
    qEnEl.textContent = '';

    answersEl.innerHTML = '';
    answersEl.dir = 'ltr';
    q.answers.forEach(a => {
      const li = document.createElement('li');
      li.textContent = a;
      answersEl.appendChild(li);
    });
    answersEnEl.innerHTML = '';
    answersEnEl.style.display = 'none';

    // Update back tag with language name
    const backTag = document.getElementById('card-back-tag');
    backTag.textContent = currentLang === 'en'
      ? 'Acceptable Answers'
      : 'Acceptable Answers (' + LANGUAGES[currentLang].name + ')';

    const pos = cardIndex + 1;
    document.getElementById('nav-counter').textContent = pos + ' / ' + total;
    document.getElementById('progress-label').textContent = pos + ' / ' + total;
    document.getElementById('progress-fill').style.width = (pos / total * 100) + '%';
    document.getElementById('btn-prev').disabled = cardIndex === 0;
    document.getElementById('btn-next').disabled = cardIndex === total - 1;
    updateStarBtn();
  }

  // ── Translation (pack lookup — no API, no cap, works offline) ──────────────
  // Returns the translated answers for a question, falling back to English.
  // Dynamic questions translate their template sentences via pack._ui while
  // officials' names pass through untouched.
  function translatedAnswers(q, pack) {
    if (q.tMeta) return renderAnswerMeta(q.tMeta, pack._ui || null);
    const entry = pack[q.id];
    return (entry && entry.a && entry.a.length === q.answers.length) ? entry.a : q.answers;
  }

  function translateCurrentCard(myVersion) {
    if (currentLang === 'en' || !deck[cardIndex]) return;
    const q = deck[cardIndex];

    const statusEl    = document.getElementById('translate-status');
    const qEl         = document.getElementById('card-question');
    const qEnEl       = document.getElementById('card-question-en');
    const answersEl   = document.getElementById('card-answers');
    const answersEnEl = document.getElementById('card-answers-en');

    if (TRANSLATION_PACKS[currentLang] === undefined) {
      statusEl.style.display = 'block';
      statusEl.textContent = 'Loading language…';
    }

    loadPack(currentLang, pack => {
      if (translateVersion !== myVersion) return; // card changed while pack was loading
      statusEl.style.display = 'none';

      if (!pack) { // pack file failed to load — show English
        statusEl.style.display = 'block';
        statusEl.textContent = 'Translation unavailable — showing English';
        setTimeout(() => { statusEl.style.display = 'none'; }, 2500);
        return;
      }

      const rtl = LANGUAGES[currentLang].rtl ? 'rtl' : 'ltr';
      const entry = pack[q.id];
      const tQ = (entry && entry.q) || q.question;

      // UI chrome in the selected language (falls back to English defaults)
      const ui = pack._ui || {};
      if (ui.readQuestion) document.getElementById('btn-read-q').textContent = '🔊 ' + ui.readQuestion;
      if (ui.readAnswer)   document.getElementById('btn-read-a').textContent = '🔊 ' + ui.readAnswer;
      if (ui.tapHint)      document.getElementById('card-hint').textContent = ui.tapHint;

      qEl.textContent = tQ;
      qEl.dir = rtl;
      qEnEl.textContent = q.question;
      qEnEl.style.display = '';

      answersEl.innerHTML = '';
      answersEl.dir = rtl;
      translatedAnswers(q, pack).forEach(a => {
        const li = document.createElement('li');
        li.textContent = a;
        answersEl.appendChild(li);
      });

      answersEnEl.innerHTML = '';
      q.answers.forEach(a => {
        const li = document.createElement('li');
        li.textContent = a;
        answersEnEl.appendChild(li);
      });
      answersEnEl.style.display = '';

      if (document.getElementById('auto-read').checked) speak(tQ);
    });
  }

  // ── Navigation ─────────────────────────────────────────────────────────────
  function flipCard() {
    if (deck.length === 0) return;
    flipped = !flipped;
    document.getElementById('flashcard').classList.toggle('flipped', flipped);
  }

  function prevCard() {
    if (cardIndex > 0) {
      cardIndex--;
      renderCard();
      translateCurrentCard(translateVersion);
    }
  }

  function nextCard() {
    if (cardIndex < deck.length - 1) {
      cardIndex++;
      renderCard();
      translateCurrentCard(translateVersion);
    }
  }

  function shuffleDeck() {
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    cardIndex = 0;
    renderCard();
    translateCurrentCard(translateVersion);
  }

  function resetDeck() { applyFilter(filter); }

  // Keyboard nav
  document.addEventListener('keydown', e => {
    if (mode !== 'flashcard') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextCard();
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prevCard();
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  });

  // Auto-read on card render (English path — translation path handles its own)
  const origRenderCard = renderCard;
  // (auto-read for English is handled below renderCard when lang=en)
  document.addEventListener('change', e => {
    if (e.target.id === 'auto-read' && e.target.checked && currentLang === 'en') {
      speakQuestion();
    }
  });

  // ── Browse mode ────────────────────────────────────────────────────────────
  function renderBrowse() {
    const container = document.getElementById('browse-list');
    container.innerHTML = '';

    if (deck.length === 0) {
      container.innerHTML = '<div class="empty-state"><p>No questions match this filter.</p></div>';
      return;
    }

    deck.forEach(q => {

      const item = document.createElement('div');
      item.className = 'browse-item' + (q.senior ? ' is-senior' : '');

      const header = document.createElement('div');
      header.className = 'browse-item-header';

      const num = document.createElement('div');
      num.className = 'browse-num';
      num.textContent = q.id;

      const qText = document.createElement('div');
      qText.className = 'browse-question';
      qText.textContent = q.question + (q.senior ? ' ★' : '');

      // Speaker button
      const speakBtn = document.createElement('button');
      speakBtn.className = 'browse-speak-btn';
      speakBtn.textContent = '🔊';
      speakBtn.title = 'Read question';
      // iOS requires speak() to be called synchronously within the tap handler.
      // Use the loaded translation pack if available, otherwise fall back to English.
      speakBtn.onclick = () => {
        const pack = TRANSLATION_PACKS[currentLang];
        const entry = pack && pack[q.id];
        if (currentLang !== 'en' && entry && entry.q) speak(entry.q);
        else speak(q.question, 'en');
      };

      // Star/flag button
      const browseStarBtn = document.createElement('button');
      browseStarBtn.className = 'browse-star-btn' + (starred.has(q.id) ? ' starred' : '');
      browseStarBtn.textContent = starred.has(q.id) ? '⚑' : '⚐';
      browseStarBtn.title = starred.has(q.id) ? 'Remove flag' : 'Flag for review';
      browseStarBtn.onclick = () => {
        const isStarred = starred.has(q.id);
        if (isStarred) starred.delete(q.id); else starred.add(q.id);
        saveStarred();
        browseStarBtn.textContent = starred.has(q.id) ? '⚑' : '⚐';
        browseStarBtn.title = starred.has(q.id) ? 'Remove flag' : 'Flag for review';
        browseStarBtn.classList.toggle('starred', starred.has(q.id));
        if (filter === 'starred') renderBrowse();
      };

      header.appendChild(num);
      header.appendChild(qText);
      header.appendChild(speakBtn);
      header.appendChild(browseStarBtn);

      const answersWrap = document.createElement('div');
      answersWrap.className = 'browse-answers';

      const label = document.createElement('p');
      label.textContent = 'Acceptable answers';
      answersWrap.appendChild(label);

      const ul = document.createElement('ul');
      q.answers.forEach(a => {
        const li = document.createElement('li');
        li.textContent = a;
        ul.appendChild(li);
      });
      answersWrap.appendChild(ul);

      item.appendChild(header);
      item.appendChild(answersWrap);
      container.appendChild(item);
    });
  }
</script>
</body>
</html>
